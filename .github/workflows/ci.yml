name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: CI=true npm run build
      - run: npm run test:unit
